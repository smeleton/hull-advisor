# Hand-computed reference cases for biocycle.valuation against data/outlets.yaml.
# Each expected number was worked out on paper from the formula
#   net = price - processing - haul_rate x miles + coproduct value per ton
# with kernel value = 2,000 lb x yield (1.0-1.3%) x $/lb. Expected = midpoint of low/high.
# If outlets.yaml changes, these must be re-derived by hand, not copied from the code.
#
# Literature-model outlets (default price = processor break-even from data/models.yaml), by hand:
#   yeast protein: 0.072 t protein/dry t x ($340 / 0.538 / 0.895 = $706.11/t protein) = 50.84
#                  - 30 cost = 20.84/dry t; x 0.88..0.91 DM = 18.34..18.96 per ton delivered
#   ethanol+biogas: 185 L x 0.90718 = 167.83 L x $0.45..0.60 = 75.52..100.70
#                  + 75 m3 x 0.90718 = 68.04 m3 x $0.10..0.25 = 6.80..17.01
#                  = 82.33..117.71 - 70 = 12.33..47.71/dry t; x DM = 10.85..43.41
#   hydrothermal:  bio-oil 0.11 x 30 GJ x 0.90718 = 2.994 GJ x $6..12 = 17.96..35.92
#                  + char 0.32 x 29 x 0.90718 = 8.419 GJ x $2..4 = 16.84..33.67
#                  = 34.80..69.60 - 150 = -115.20..-80.40/dry t; x DM = -104.83..-70.75

- id: default_lot
  description: 1,000 t, haul $0.30/ton-mile, no quality data, no edits.
  lot: {tons: 1000, haul_rate: 0.30}
  expect:
    ranking: [clean_and_recover, local_dairy, distant_dairy, bioenergy, compost_soil, fermentation_ethanol,
              fermentation_yeast_protein, bioenergy_htl, food_ingredient, fermented_feed, biomaterial_hydrochar]
    outlets:
      local_dairy:       {net_low: 70, net_high: 100, net_expected: 85, break_even: 91}    # 76-106 - 0 - 6; BE price = 85 + 6
      distant_dairy:     {net_low: 41, net_high: 71, net_expected: 56, break_even: 160}   # 116-146 - 0 - 75
      clean_and_recover: {net_low: 80, net_high: 116, net_expected: 98, break_even: 78}   # 76-106 - 10 - 6 + 20..26
      compost_soil:      {net_low: 6, net_high: 26, net_expected: 16, break_even: 99}     # 20-40 - 5 - 9
      bioenergy:         {net_low: 7, net_high: 27, net_expected: 17, break_even: 103}    # 25-45 - 0 - 18
      food_ingredient:   {needs_quote: true, break_even: 175}                             # 85 + 60 + 30
      fermentation_yeast_protein: {net_low: 0.34, net_high: 0.96, net_expected: 0.65, break_even: 103}  # 18.34-18.96 - 18
      fermentation_ethanol:       {net_low: -7.15, net_high: 25.41, net_expected: 9.13, break_even: 103} # 10.85-43.41 - 18
      bioenergy_htl:     {net_low: -134.83, net_high: -100.75, net_expected: -117.79, break_even: 115}  # -104.83..-70.75 - 30
      fermented_feed:    {needs_quote: true, break_even: 106}                             # 85 + 15 + 6
      biomaterial_hydrochar: {needs_quote: true, break_even: 115}                         # 85 + 0 + 30
    vs_local_total: {clean_and_recover: 13000, distant_dairy: -29000}

- id: cheap_haul_small_lot
  description: 500 t at the low end of the published haul range ($0.20).
  lot: {tons: 500, haul_rate: 0.20}
  expect:
    ranking: [clean_and_recover, local_dairy, distant_dairy, bioenergy, compost_soil, fermentation_ethanol,
              fermentation_yeast_protein, bioenergy_htl, food_ingredient, fermented_feed, biomaterial_hydrochar]
    outlets:
      local_dairy:       {net_expected: 87}    # 91 - 4
      distant_dairy:     {net_expected: 81}    # 131 - 50
      clean_and_recover: {net_expected: 100}   # 91 - 10 - 4 + 23
      bioenergy:         {net_expected: 23}    # 35 - 12
      compost_soil:      {net_expected: 19}    # 30 - 5 - 6
      fermentation_yeast_protein: {net_expected: 6.65}   # 18.65 - 12
    vs_local_total: {clean_and_recover: 6500, distant_dairy: -3000}

- id: high_fiber
  description: Crude fiber 16% fails the feed standard; feed outlets drop below priced non-feed outlets.
  lot: {tons: 1000, haul_rate: 0.30, crude_fiber_pct: 16}
  expect:
    ranking: [bioenergy, compost_soil, fermentation_ethanol, fermentation_yeast_protein, bioenergy_htl,
              clean_and_recover, local_dairy, distant_dairy, food_ingredient, biomaterial_hydrochar, fermented_feed]
    ineligible: [local_dairy, distant_dairy, clean_and_recover, fermented_feed]

- id: food_quote
  description: A $200/t hull-powder quote makes the food outlet rankable and best.
  lot: {tons: 1000, haul_rate: 0.30}
  overrides: {food_ingredient: {price: 200}}
  expect:
    ranking: [food_ingredient, clean_and_recover, local_dairy, distant_dairy, bioenergy, compost_soil,
              fermentation_ethanol, fermentation_yeast_protein, bioenergy_htl, fermented_feed, biomaterial_hydrochar]
    outlets:
      food_ingredient: {net_low: 110, net_high: 110, net_expected: 110}   # 200 - 60 - 30
    vs_local_total: {food_ingredient: 25000}

- id: worthless_kernels
  description: Kernel price $0/lb; cleaning only costs money, so selling locally wins.
  lot: {tons: 1000, haul_rate: 0.30}
  overrides: {clean_and_recover: {coproduct_prices: {Recovered kernel: 0}}}
  expect:
    ranking: [local_dairy, clean_and_recover, distant_dairy, bioenergy, compost_soil, fermentation_ethanol,
              fermentation_yeast_protein, bioenergy_htl, food_ingredient, fermented_feed, biomaterial_hydrochar]
    outlets:
      clean_and_recover: {net_low: 60, net_high: 90, net_expected: 75}   # 76-106 - 10 - 6

- id: allocation_default_buyers
  description: The six fictional sample buyers on the default lot.
  lot: {tons: 1000, haul_rate: 0.30}
  expect:
    # Food D 150 t x (180-60-30=90) + Dairy B 400 t x (97-10.5=86.5) + Dairy A 450 t x (90-4.5=85.5)
    allocation: {total_value: 86575, tons_allocated: 1000, lot_marginal: 85.5}

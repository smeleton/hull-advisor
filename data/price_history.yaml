# Historical almond-hull feed prices ($/ton) used to replay the recommendation over past
# markets (evals/math_checks.py :: backtest). Every point cites sources.yaml.
# Point prices only; when a source gives a range we keep both ends as separate points.

- period: "2020"
  price_per_ton: 93
  source_id: wcngg2022
  note: Average 2020 hull price.
- period: "2021"
  price_per_ton: 130
  source_id: wcngg2022
  note: Average 2021 hull price.
- period: "price slump"
  price_per_ton: 60
  source_id: farmprogress_low

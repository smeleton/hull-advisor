# Evidence: one record per number taken from the research literature.
#
# This is the literature half of the decision engine. Each record says what was measured, on
# what material, under what conditions, where in the source it appears, and how strong the
# evidence is. data/models.yaml builds the per-ton math only from these ids, so every literature
# number in a result traces back to a line here (and its source in sources.yaml).
#
# Fields
#   value_low/value_high  the number in `unit` (equal when the source gives one value)
#   unit                  "numerator/denominator" with *-joined tokens; the loader checks that a
#                         model's units multiply out. tonne = metric tonne, t = US short ton;
#                         t_dry = a short ton of hull dry matter, t_hull = hulls as delivered.
#                         Mass fractions are stored as fractions (0.051), percentages as pct.
#   reported              the number as the source states it, for checking by eye
#   evidence_level        database | review | animal_trial | in_vitro | lab | thesis | extension
#                         | market_report
#   feedstock             what was actually tested; never borrow a shell result for hulls
#   notes                 caveats, conflicts inside the paper, assumptions we made
#
# Re-check a record against its source before relying on it; add new papers the same way.


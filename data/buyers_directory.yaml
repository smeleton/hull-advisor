# Real companies that buy, trade or work with almond hulls (or, for energy, almond shells).
# Rules: public business information only, each entry backed by a page we loaded, with a
# short quote and the date it was checked. No personal names, emails or phone numbers, and no
# guessed URLs. Listing is not an endorsement and does not mean the company will buy a lot.
# Outlet ids match data/outlets.yaml. Status: active | listed (named by a trade group) |
# research (R&D stage) | planned (not yet operating).

- id: penny_newman
  name: Penny Newman Grain Co.
  outlets: [local_dairy, distant_dairy]
  what: Merchandises almond hulls and shells as feed by-products; Stockton rail terminal with BNSF and UP access; ships hulls to a Levelland, Texas site.
  location: Fresno (HQ); Hanford, Stockton and Elk Grove, CA; Levelland, TX
  website: https://penny-newman.com
  contact_url: https://penny-newman.com/contact/
  status: active
  evidence:
    - url: https://penny-newman.com/by-products/
      quote: "List of by-products merchandized by Penny Newman include but are not limited to: … Almond Hulls, Almond Shell"
    - url: https://penny-newman.com/stockton-transloading/
      quote: "reciprocal access to both the BNSF and UP Railroads"
    - url: https://www.kcbd.com/2023/12/27/closer-look-economic-development-deal-that-brought-penny-newman-levelland
      quote: "drought conditions forced the grain company to change its focus from cotton seed to almond hulls."
  checked: 2026-11-07
  notes: The by-products list on its site is an image.


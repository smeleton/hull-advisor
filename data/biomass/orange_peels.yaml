quality_notes:
- Spoils quickly raw; the same vendor page describes lime + pressing + sealed 1-ton bags and ~1 month
  ensiling for storage [orange_vincent_waste].
- Ensiling removes up to >70% of d-limonene and keeps up to ~90% of biomethane yield [orange_ad_ensiling].
- 'd-limonene inhibits anaerobic digestion: IC50 423-669 mg/L, reversible [orange_ad_limonene].'
- 'Cattle: dairy diet inclusion <20% of DM, intake drops >24%; beef 20-30% DM [orange_feedipedia].'
- 'Pesticide residue and mold not documented in sources loaded (placeholder concern: confirm with buyer).'
caveats:
- 'Directory is thin: 4 companies, all orange or generic organics. ZERO companies for mango and kiwi peel
  specifically (no CA processor, flour maker or extractor found).'
- 'Kiwi: CA grows 40,600 t (2025) but sells mostly fresh; the only UC page on processing (UC Small Farms,
  1990) returned 403 and was NOT loaded. Peel volume is likely small; treat as pilot-scale.'
- 'Orange: statewide peel tonnage is unknown. 285,000 t/yr (Ventura Coastal to dairies) rests on a search-result
  excerpt only (page 403); the Tipton fruit throughput (250-350k t) is from a loaded 2012-14 order and
  likely outdated.'
- 'Orange baseline price is a placeholder: no loaded page gives a CA wet-peel price. Dried pulp pellet
  price is placeholder too (trade-site 2026 quotes of $210-295/MT seen only in an unloaded excerpt).'

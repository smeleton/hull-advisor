- id: tomato_ad_biogas
  name: Anaerobic digestion (biogas)
  description: Pomace (alone or after lycopene extraction) digested for methane; only lab results found,
    no CA tomato-pomace digester.
  status: emerging
  market: energy
  pathway: digestion
  price_low: -35
  price_high: 0
  price_tier: placeholder
  processing_cost_per_ton: 0
  processing_tier: placeholder
  default_miles: 30
  miles_tier: placeholder
  coproducts: []
  nutrient_routes:
  - digestate_land_application
  - struvite
  - ammonia_stripping
  requirements:
  - Digester with solids handling; lab digestion at 55 C for 90 days [tomato_ucdavis_allison2017]
  - 'Measured methane: 320 NmL CH4 per g of volatile solids; alkaline pretreatment did not raise it [team_yields_2026].
    Volatile solids are 97% of dry matter [tomato_ucdavis_allison2017]. The digester owner keeps the gas;
    you get the gate fee.'
  risks:
  - No operating CA example found
  - Lycopene extraction first lowers CH4 ~27% unless extract aqueous fraction is added back [tomato_ucdavis_allison2017]
  source_ids:

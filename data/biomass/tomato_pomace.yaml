- id: tomato_feed_dried
  name: Dried / ground / extruded pomace ingredient
  description: Pomace dried (sun or gas drum dryer) to <10% moisture, ground or extruded, sold as shelf-stable
    feed or food fiber and protein ingredient.
  status: established
  market: feed
  price_low: 60
  price_high: 100
  price_tier: placeholder

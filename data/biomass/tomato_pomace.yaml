  haul_product: true
  processing_cost_per_ton: 38
  processing_tier: placeholder
  default_miles: 120
  miles_tier: placeholder
  coproducts: []
  requirements:
  - Dryer capacity; Morning Star runs solar and gas drum dryers [tomato_morningstar_powders_brochure]
  - 'Specs: dry <10% moisture, extruded gives kill step [tomato_morningstar_pomace_brochure]'
  - Drying from about 65% to 10% moisture leaves about 0.39 t of dried pomace per wet ton [tomato_morningstar_pomace_brochure];
    the price is per ton of dried product.
  risks:
  - Drying cost vs price
  - Largest processor sells the same product directly, so competition [tomato_morningstar_pomace_brochure]

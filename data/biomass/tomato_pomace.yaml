outlets:
- id: tomato_feed_wet
  name: Wet pomace to dairy cattle feed
  description: Pomace sold direct off the factory line (about 65% moisture) to nearby dairies and blended
    or ensiled into rations.
  status: established
  market: feed
  price_low: 0
  price_high: 8
  price_tier: placeholder
  processing_cost_per_ton: 0
  processing_tier: placeholder
  default_miles: 40
  miles_tier: placeholder
  coproducts: []
  requirements:
  - Feed within ~2 days or ensile [tomato_feedipedia_689]
  - Ensiled pomace tested to 12% of dairy diet DM [tomato_feedipedia_689]
  - Feed license/tonnage tax apply to feed firms; tomato pomace eligible for reduced fee [tomato_agalert2022]
  risks:
  - Spoilage and mold in storage [tomato_feedipedia_689]
  - Value drops with distance because of water weight [tomato_wikipedia]
  - Seasonal glut July-Oct

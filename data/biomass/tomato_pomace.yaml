quality_notes:
- Fresh pomace spoils in under 2 days; must be fed, dried or ensiled quickly [tomato_feedipedia_689].
  Molds if stored more than several days (search summary only, not cited).
- Ensiled pomace tested up to 12% of dairy diet DM with no change in intake or milk yield [tomato_feedipedia_689].
- Skin-rich, so potential pesticide residues higher than the fruit (uncited Wikipedia claim) [tomato_wikipedia].
- Shipping cost high because of water weight [tomato_wikipedia].
- Lycopene is lost by oven/solar drying (below detection in solar-dried samples) [tomato_ucdavis_allison2017].

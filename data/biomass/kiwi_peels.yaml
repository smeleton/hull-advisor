quality_notes:
- Peel carries trichomes (fuzz); not palatable, fibrous; feed use not documented in sources loaded.
- Spoilage and pesticide residue data not found (placeholder concern).
caveats:
- 'Directory is thin: 4 companies, all orange or generic organics. ZERO companies for mango and kiwi peel
  specifically (no CA processor, flour maker or extractor found).'
- 'Kiwi: CA grows 40,600 t (2025) but sells mostly fresh; the only UC page on processing (UC Small Farms,
  1990) returned 403 and was NOT loaded. Peel volume is likely small; treat as pilot-scale.'
- Kiwi K = 93.94 mg/g d.b. (9.4%) looks high; flagged. Mango N/K/Mg derived from fresh-basis values in
  a 4-cultivar Mexican study.
- PMC and several .gov PDFs were read via Europe PMC XML or downloaded PDF text; some tables were cut
  off (kiwi P/Mg/Ca).

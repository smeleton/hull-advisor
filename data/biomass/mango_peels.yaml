quality_notes:
- High-moisture, sugary peel; will ferment/mold within a day or two unrefrigerated (placeholder; no source
  loaded).
- Peel and seed disposal must follow local environmental law [mango_ufifas_hs1443].
- Peel flour is a research/ingredient concept; peel powder tested at 5-10% in biscuits/macaroni [mango_auctores].
  The glycemic-index claim is NOT supported by the pages loaded.
caveats:
- 'Directory is thin: 4 companies, all orange or generic organics. ZERO companies for mango and kiwi peel
  specifically (no CA processor, flour maker or extractor found).'
- 'Mango: no meaningful CA volume. Mangos are imported (Mexico), so peel exists only at fresh-cut plants;
  no volume found. Peel flour and pectin are research-stage; market data absent.'
- 'Kiwi: CA grows 40,600 t (2025) but sells mostly fresh; the only UC page on processing (UC Small Farms,
  1990) returned 403 and was NOT loaded. Peel volume is likely small; treat as pilot-scale.'
- Kiwi K = 93.94 mg/g d.b. (9.4%) looks high; flagged. Mango N/K/Mg derived from fresh-basis values in
  a 4-cultivar Mexican study.

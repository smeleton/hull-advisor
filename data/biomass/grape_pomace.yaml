outlets:
- id: grape_feed_wet
  name: Wet pomace to dairy/beef cattle feed
  description: Fresh pomace trucked within a day or two to dairies or a feed processor and blended into
    rations at roughly 10-15% of diet.
  status: established
  market: feed
  price_low: 0
  price_high: 10
  price_tier: placeholder
  processing_cost_per_ton: 0
  processing_tier: placeholder
  default_miles: 60
  miles_tier: placeholder
  coproducts: []
  requirements:
  - Deliver fresh, within 1-2 days of pressing [grape_palatepress]
  - Dairy/feed buyer within trucking distance; commercial-feed licensing and tonnage tax apply to feed
    firms [both_cdfa_tonnage2022]
  - Tested inclusion 10-15% of diet [grape_ucdavis_methane_news]
  risks:
  - Poor digestibility (~30%) caps value [grape_palatepress]
  - Coastal wineries lack nearby dairies, so route may be unavailable [both_agproud_byproducts]
  - Residue (pesticide, sulfite) limits not sourced
  source_ids:
  - both_agproud_byproducts
  - both_cdfa_tonnage2022
  - grape_ucdavis_methane_news
  - grape_pressdemocrat2015
  - grape_palatepress
- id: grape_compost
  name: Compost (on site or at a commercial facility) and return to vineyard
  description: Pomace composted on the winery, or hauled to a commercial composter such as the Napa facility,
    then applied back to vineyards or sold as compost.
  status: established
  market: soil
  pathway: compost
  price_low: -40
  price_high: 0
  price_tier: placeholder
  processing_cost_per_ton: 0
  processing_tier: placeholder
  default_miles: 20
  miles_tier: placeholder
  coproducts: []
  nutrient_routes:
  - compost_retained
  requirements:
  - High pomace share makes compost acidic; carbon source (e.g. rice hulls) needed [grape_wastedive_napa]
  - Vineyard compost rates 1 ton/acre established, 2-3 tons/acre new plantings [grape_winemakermag]
  - 'Large volumes: many vineyards compost on site [grape_zerowastesonoma_pomace]'
  risks:
  - Slow because phenols resist composting [grape_palatepress]
  - Compost stockpiles seasonal glut (Aug-Nov) [grape_wastedive_napa]
  - Central Valley compost gate fees for food and yard waste are $47.12/ton for Modesto residents and $93.01/ton
    for non-residents [modesto_compost_rates]; Sacramento County's Kiefer landfill charges $115.65/ton for green
    waste (2026) [sacco_kiefer_fees_2026]. Farm-residue composters may charge less. Get a quote from your composter.
  source_ids:
  - grape_wastedive_napa
  - grape_napagreen_2022
  - grape_naparecycling_winery
  - grape_zerowastesonoma_pomace
  - grape_californiabountiful2024
  - grape_winemakermag
- id: grape_feed_dried
  name: Dried pomace as stable feed ingredient
  description: Pomace dried to ~9% moisture (seeds, skins, stems) and sold as a storable feed ingredient.
  status: established
  market: feed
  price_low: 55
  price_high: 100
  price_tier: placeholder
  mass_yield: 0.46
  haul_product: true
  processing_cost_per_ton: 35
  processing_tier: placeholder
  default_miles: 150
  miles_tier: placeholder
  coproducts: []
  requirements:
  - Dryer (gas or solar), target DM ~91% [grape_feedipedia_dehydrated]
  - Drying from about 58% to 9% moisture leaves about 0.46 t of dried pomace per wet ton [grape_ucdavis_allison2018];
    the price is per ton of dried product.
  risks:
  - Small market [both_agproud_byproducts]
  - Drying energy can exceed product value
  source_ids:
  - both_agproud_byproducts
  - grape_feedipedia_dehydrated
  - grape_ucdavis_allison2018
- id: grape_ad_biogas
  name: Anaerobic digestion (biogas / RNG)
  description: Wet pomace co-digested in a high-solids digester; Napa's composting site is adding one
    but has no confirmed start date.
  status: emerging
  market: energy
  pathway: digestion
  price_low: -35
  price_high: 0
  price_tier: placeholder
  processing_cost_per_ton: 0
  processing_tier: placeholder
  default_miles: 30
  miles_tier: placeholder
  coproducts: []
  nutrient_routes:
  - digestate_land_application
  - struvite
  - ammonia_stripping
  requirements:
  - High-solids AD capacity within haul distance [grape_biocycle_napa_ad]
  - 'Feedstock acceptable to operator (Napa: food/green waste base, ~44,000 t/yr design) [grape_biocycle_napa_ad]'
  - 'Measured methane: 0.125 Nm³ CH4 per kg of COD [team_yields_2026]. The digester owner keeps the gas;
    you get the gate fee.'
  risks:
  - Napa digester not yet operating per sources [grape_biocycle_napa_ad]
  - Extraction before AD lowers methane ~11% [grape_ucdavis_allison2018]

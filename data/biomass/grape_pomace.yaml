# Grape pomace: profile and outlets. Generated from verified research notes (scratchpad tools/build_biomass.py), then reviewed.
# Prices are $/short ton as delivered (negative = you pay, e.g. a gate fee); for outlets with mass_yield < 1 the price is per ton of product.
# Tiers: sourced (cited page we loaded), user (your team's figures, links pending), placeholder (demo value).

id: grape_pomace
name: Grape pomace
noun: pomace
producers: Wineries
unit_label: short tons of grape pomace as delivered
season: Aug-Nov (Upper Valley collects Aug to early Nov) [grape_wastedive_napa]; produced in a few short
  fall weeks [grape_palatepress]
ca_volume: About 385,000 tons a year (UC Davis estimate) [grape_ucdavis_allison2018].
summary: Skins, seeds and stems left after pressing, about 55–60% water [grape_ucdavis_allison2018], produced
  in a few weeks at crush.

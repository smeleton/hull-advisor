quality_notes:
- 'Feed only fresh: within a day or two of pressing [grape_palatepress]. Poorly digestible (~30% vs alfalfa
  ~70%) [grape_palatepress].'
- 'UC Davis trial: 10% and 15% of diet, methane -10 to -11%, milk unchanged [grape_ucdavis_methane_news].'
- High-pomace compost is acidic; Upper Valley blends rice hulls [grape_wastedive_napa]. Phenols slow composting
  [grape_palatepress].
- 'Sulfite and pesticide residue limits for feed: no sourced number found (placeholder concern; confirm
  with buyer).'
- Dried product must contain seeds, skins and stems per Feedipedia description [grape_feedipedia_dehydrated].

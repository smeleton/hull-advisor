# Prices are $/short ton as delivered (negative = you pay, e.g. a gate fee); for outlets with mass_yield < 1 the price is per ton of product.
# Tiers: sourced (cited page we loaded), user (your team's figures, links pending), placeholder (demo value).

id: pistachio_hulls
name: Pistachio hulls
noun: hulls
producers: Pistachio hullers and processors
unit_label: short tons of pistachio hulls as delivered
season: Mid-Aug to Oct, 30-45 days (hulling is seasonal; 5 weeks from early Sept at one plant)
ca_volume: Not published; scales with the pistachio crop.
summary: The soft green hull removed at the huller, about 72% water. It spoils within days, so it has
  to move fast [pist_boga2013].

quality_notes:
- Wet hulls are ~72% water and ferment/mold fast; spoilage window is placeholder (days, not sourced).
- Shell contamination in hull feed has killed dairy cattle (UCCE/CAHFS case; reported only in a search
  snippet, page could not be loaded). Treat as a real risk; ask for UCCE page confirmation.
- Hull damage and navel orangeworm are linked to aflatoxin entry into pistachios; screen for aflatoxin
  before feed or food use. [pist_michailides2017]
- Condensed tannins ~2-2.6% of DM may limit feeding rates. [pist_boga2013]
- Plants are moving from wet to dry hulling (less wastewater, drier hull solids). [pist_wdr_monarch2017]
caveats:
- Almond-shell prices ($0-20/ton) rest on 2018 sources (West Biofuels, CeresAI). Giannini 2026 gives no
  current shell price and calls shell markets 'less transparent'. Treat as stale.
- 'Pistachio hull data are thin: no CA volume (tons), no price, no CA composition. Hull moisture/composition
  are Turkish varieties (Boga 2013), ~72% moisture derived from DM 26-29%. All hull prices, volumes, N-P-K,
  spoilage time are placeholders.'
- Pistachio baseline (cattle feed) rests on four Water Board permits (2009-2020), not a survey; land application
  is also common, and several plants moved to dry hulling.
- Biogas evidence (154-305 mL CH4/g COD) is for Turkish pistachio WASTEWATER, not hulls. Extraction (phenolic/pectin)
  has no loaded evidence or price; user-supplied Springer/PubMed/ScienceDirect/ResearchGate links could
  not be loaded.

quality_notes:
- Shells foul and slag in conventional combustion (high-fouling ash). [shells_westbio2018, shells_chen2010]
- 'Debris: up to 20% of incoming load weight at one processor once came from sticks, rocks and other debris.
  [shells_abc_emerging]'
- Shell K is largely water-soluble, available within days to weeks, so ~$35-38/ton K2O-equivalent value
  if returned to orchards. [shells_giannini2026]
- 'Aflatoxin/spoilage: not a recognised issue for dry shells in loaded sources (placeholder statement,
  not sourced).'
caveats:
- Almond-shell prices ($0-20/ton) rest on 2018 sources (West Biofuels, CeresAI). Giannini 2026 gives no
  current shell price and calls shell markets 'less transparent'. Treat as stale.
- 'Pistachio hull data are thin: no CA volume (tons), no price, no CA composition. Hull moisture/composition
  are Turkish varieties (Boga 2013), ~72% moisture derived from DM 26-29%. All hull prices, volumes, N-P-K,
  spoilage time are placeholders.'

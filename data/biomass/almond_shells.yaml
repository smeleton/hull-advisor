  - Shell sampling/nutrient testing and application timing guidance still being developed [shells_giannini2026]
  - Spreader equipment availability
  risks:
  - Not independently validated at scale as mulch beyond nutrients [shells_giannini2026]
  - Shell supply covers only ~14% of bearing acreage [shells_giannini2026]
  - The price is derived from the shells' potassium value ($35–38/ton) less spreading ($15/ton) [shells_giannini2026];
    it is not a quoted price.

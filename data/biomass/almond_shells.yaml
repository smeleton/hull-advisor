# Almond shells: profile and outlets. Generated from verified research notes (scratchpad tools/build_biomass.py), then reviewed.
# Prices are $/short ton as delivered (negative = you pay, e.g. a gate fee); for outlets with mass_yield < 1 the price is per ton of product.
# Tiers: sourced (cited page we loaded), user (your team's figures, links pending), placeholder (demo value).

id: almond_shells
name: Almond shells
noun: shells
producers: Almond hullers and shellers
unit_label: short tons of almond shells as delivered
season: 'Aug-Nov hulling peak; shells accumulate and are shipped Sep-Mar (placeholder: season not stated
  in loaded sources)'
ca_volume: About 875,500 tons a year (2024–25) [shells_giannini2026].
summary: 'The hard shell around the almond kernel: dry, woody and energy-dense, so it suits bedding, fuel,
  biochar and materials rather than feed [shells_abc_emerging].'
baseline: shells_bedding
market_data: false
must_place: false
default_tons: 1000
moisture_default: 4.2
ef_material: yard_trimmings
rules:
